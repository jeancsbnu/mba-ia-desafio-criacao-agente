[project]
name = "residencial-aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora (Google ADK + FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "google-adk==2.9.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Avisos de dentro das bibliotecas (ADK e Starlette), não do código do projeto.
filterwarnings = [
    "ignore:\\[EXPERIMENTAL\\]:UserWarning",
    "ignore:BaseAgentConfig is deprecated:DeprecationWarning",
    "ignore:The `plugins` argument is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
